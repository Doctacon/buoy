[project]
name = "buoy-search"
dynamic = ["version"]
description = "Local DuckDB hybrid search with offline embeddings and anchored citations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Buoy maintainers" }]
keywords = ["hybrid-search", "rag", "retrieval", "duckdb", "vector-search", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "sentence-transformers",
    "torch>=2.6",
    "transformers==5.12.1",
    "PyYAML",
    "scrapling[fetchers]==0.4.9",
    "markdownify>=1.2.0",
    "markitdown[docx,pdf,pptx,xls,xlsx]",
    "duckdb>=1.5.4",
    "portalocker>=3.2.0",
    "opentelemetry-sdk>=1.44,<2",
]

[project.optional-dependencies]
mcp = ["mcp==2.2.0", "anyio>=4.5,<5", "pydantic>=2.11,<3"]
bigquery = ["google-cloud-bigquery>=3.25,<4"]
snowflake = ["snowflake-connector-python>=3.12,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/Doctacon/buoy"
Issues = "https://github.com/Doctacon/buoy/issues"
Changelog = "https://github.com/Doctacon/buoy/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Doctacon/buoy/tree/main/docs"

[project.scripts]
buoy = "buoy_search.cli.entrypoint:main"

[build-system]
requires = ["hatchling==1.31.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = ["/.10x/**"]

[tool.hatch.build.hooks.vcs]
version-file = "src/buoy_search/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/buoy_search"]

[tool.hatch.build.targets.sdist]
artifacts = ["images/buoy.svg"]

# WSL/Linux and Windows use CPU wheels by default: no multi-GB CUDA runtime.
# GPU use is optional and requires an explicitly installed matching torch build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
