name: Release readiness

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out prospective merge result
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install lockfile validator
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Validate paused publication policy
        run: |
          uv sync --locked --python 3.13
          uv run python scripts/release_automation.py validate-source
          uv lock --check

  python-311:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Check out prospective merge result
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          python-version: "3.11"
      - name: Validate and test
        run: |
          uv sync --locked --python 3.11
          PYTHONDONTWRITEBYTECODE=1 uv run python scripts/release_automation.py validate-source
          PYTHONDONTWRITEBYTECODE=1 uv run python scripts/validate_ranking_contract.py
          PYTHONDONTWRITEBYTECODE=1 uv run python scripts/c6_syntax_forecast.py validate
          PYTHONDONTWRITEBYTECODE=1 uv run python -m unittest discover -s tests -p 'test_*.py' -q

  python-313:
    name: Python 3.13
    runs-on: ubuntu-latest
    steps:
      - name: Check out prospective merge result
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Validate and test
        run: |
          uv sync --locked --python 3.13
          PYTHONDONTWRITEBYTECODE=1 uv run python scripts/release_automation.py validate-source
          PYTHONDONTWRITEBYTECODE=1 uv run python scripts/validate_ranking_contract.py
          PYTHONDONTWRITEBYTECODE=1 uv run python scripts/c6_syntax_forecast.py validate
          PYTHONDONTWRITEBYTECODE=1 uv run python -m unittest discover -s tests -p 'test_*.py' -q

  distribution:
    name: Distribution
    needs:
      - python-311
      - python-313
    runs-on: ubuntu-latest
    steps:
      - name: Check out prospective merge result
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install build Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Build and inspect diagnostic distributions
        run: |
          uv sync --locked --python 3.13
          uv build --out-dir dist
          uv run python scripts/release_automation.py validate-distribution dist
      - name: Smoke a clean wheel installation
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/buoy-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/buoy" --version
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/buoy" --help >/dev/null
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" -m buoy_search --help >/dev/null
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" - <<'PY'
          from buoy_search.treatment_token_budget import exact_token_count, load_pinned_tokenizer
          assert exact_token_count(load_pinned_tokenizer(), "Buoy release tokenizer smoke.") == 9
          PY
