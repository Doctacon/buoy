name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  paused:
    name: Publication paused
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked validation environment
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Validate source-only release state
        run: |
          uv sync --locked --python 3.13
          uv run python scripts/release_automation.py validate-source
