name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --locked --extra mcp --python ${{ matrix.python-version }}

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Build and inspect wheel and source distribution
        run: |
          uv sync --locked --python 3.13
          uv build --out-dir dist
      - name: Smoke a clean wheel installation
        run: |
          export HOME="$RUNNER_TEMP/buoy-wheel-home"
          export XDG_CACHE_HOME="$RUNNER_TEMP/buoy-wheel-cache"
          export UV_CACHE_DIR="$XDG_CACHE_HOME/uv" HF_HOME="$XDG_CACHE_HOME/hf" TORCH_HOME="$XDG_CACHE_HOME/torch"
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$HOME"
          uv venv --python 3.13 "$RUNNER_TEMP/buoy-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/buoy" --help >/dev/null
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/buoy" mcp --help >/dev/null
          if "$RUNNER_TEMP/buoy-wheel-smoke/bin/buoy" mcp; then exit 1; fi
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" -m buoy_search --help >/dev/null
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" - <<'PY'
          import hashlib
          import json
          from importlib.resources import files
          from buoy_search.indexing.treatment_token_budget import exact_token_count, load_pinned_tokenizer
          from buoy_search.evals.routing_quality import (
              DEFAULT_ROUTING_CALIBRATION,
              DEFAULT_ROUTING_CANARY_DIR,
              load_routing_confidence_calibration,
              load_routing_quality_dataset,
          )

          assert exact_token_count(load_pinned_tokenizer(), "Buoy release tokenizer smoke.") == 9
          expected = {
              "rentptr.json": "5a39c38d302cbc5c6d758b1e48d4456456a4357248f559a6cf56e0234742f4f5",
              "salesforce.json": "32106e02d877788e676cdb3db3f7a3567f57f96fa009a7a558b82ca1d407d13d",
              "whiteboxgeo.json": "5558a4e8a786f0a5553ba0237ebf8248a5d576bd1937ffd69cf9af66a8ac0916",
          }
          assert tuple(sorted(path.name for path in DEFAULT_ROUTING_CANARY_DIR.iterdir())) == tuple(sorted(expected))
          assert {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in DEFAULT_ROUTING_CANARY_DIR.iterdir()
          } == expected
          dataset = load_routing_quality_dataset()
          assert len(dataset.cases) == 65
          assert dataset.suite_sha256 == "0e648b1222298b443439aa8b85527048b54f51b7ef2518956d43cd6bee2981e5"
          authority = load_routing_confidence_calibration()
          assert authority.mode in {"collect", "active"}
          assert authority.mode == json.loads(DEFAULT_ROUTING_CALIBRATION.read_bytes())["mode"]
          promotion_baskets = json.loads(
              files("buoy_search").joinpath("data/repo_ranking_promotion_baskets.json").read_bytes()
          )
          assert promotion_baskets == {"baskets": [], "schema_version": 1}
          if authority.mode == "active":
              assert authority.owner_approved is True
              assert authority.certification_passed is True
              assert authority.receipts is not None
          PY
      - name: Verify base and extra MCP wheel installations
        run: |
          set -- dist/*.whl
          test "$#" -eq 1
          wheel="$(realpath "$1")"
          export HOME="$RUNNER_TEMP/buoy-mcp-install-home" UV_CACHE_DIR="$RUNNER_TEMP/buoy-mcp-install-cache"
          mkdir -p "$HOME"
          uv venv --python 3.13 "$RUNNER_TEMP/buoy-mcp-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/buoy-mcp-wheel-smoke/bin/python" "$wheel[mcp]"
          env -i PATH="$PATH" HOME="$HOME" HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 PYTHONDONTWRITEBYTECODE=1 \
            "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" tests/core/mcp_installation_smoke.py --mode base --wheel "$wheel"
          env -i PATH="$PATH" HOME="$HOME" HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 PYTHONDONTWRITEBYTECODE=1 \
            "$RUNNER_TEMP/buoy-mcp-wheel-smoke/bin/python" tests/core/mcp_installation_smoke.py --mode extra --wheel "$wheel"
