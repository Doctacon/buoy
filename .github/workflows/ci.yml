name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Validate source and frozen contracts
        run: |
          PYTHONDONTWRITEBYTECODE=1 uv run python scripts/release_automation.py validate-source
          PYTHONDONTWRITEBYTECODE=1 uv run python scripts/validate_ranking_contract.py
          PYTHONDONTWRITEBYTECODE=1 uv run python scripts/c6_syntax_forecast.py validate
      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 uv run python -m unittest discover -s tests -p 'test_*.py' -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Build and inspect wheel and source distribution
        run: |
          uv sync --locked --python 3.13
          uv build --out-dir dist
          uv run python scripts/release_automation.py validate-distribution dist
      - name: Smoke a clean wheel installation
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/buoy-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/buoy" --help >/dev/null
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" -m buoy_search --help >/dev/null
          "$RUNNER_TEMP/buoy-wheel-smoke/bin/python" - <<'PY'
          from buoy_search.treatment_token_budget import exact_token_count, load_pinned_tokenizer
          assert exact_token_count(load_pinned_tokenizer(), "Buoy release tokenizer smoke.") == 9
          PY
